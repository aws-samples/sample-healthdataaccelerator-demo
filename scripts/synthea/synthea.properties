# Synthea Configuration for Healthcare Demo
# Generates synthetic patient data with clinical notes for OpenEMR

# =============================================================================
# EXPORTER SETTINGS
# =============================================================================

# Enable FHIR R4 export (required for HealthLake compatibility)
exporter.fhir.export = true
exporter.fhir_r4.export = true
exporter.fhir_stu3.export = false
exporter.fhir_dstu2.export = false

# Enable clinical notes export (unstructured doctor's notes)
exporter.clinical_note.export = true

# Enable text export per encounter for additional clinical documentation
exporter.text.export = true
exporter.text.per_encounter_export = true

# Disable other export formats we don't need
exporter.ccda.export = false
exporter.csv.export = false
exporter.cpcds.export = false
exporter.hospital.fhir.export = false
exporter.practitioner.fhir.export = false

# Output directory (relative to Synthea installation)
exporter.baseDirectory = ./output/

# =============================================================================
# PATIENT DEMOGRAPHICS
# =============================================================================

# Generate diverse demographics
generate.demographics.default_file = geography/demographics.csv

# Enable all demographic fields
generate.demographics.socioeconomic.enabled = true

# =============================================================================
# CLINICAL DATA GENERATION
# =============================================================================

# Enable all clinical modules for comprehensive patient records
generate.only_alive_patients = false
generate.only_dead_patients = false

# Generate complete medical histories
generate.append_numbers_to_person_names = false

# Include all condition types
generate.conditions.enabled = true

# Include allergies
generate.allergies.enabled = true

# Include medications
generate.medications.enabled = true

# Include immunizations
generate.immunizations.enabled = true

# Include procedures
generate.procedures.enabled = true

# Include observations (vitals, lab results)
generate.observations.enabled = true

# Include encounters
generate.encounters.enabled = true

# Include care plans
generate.careplans.enabled = true

# Include imaging studies
generate.imaging_studies.enabled = true

# =============================================================================
# FHIR SPECIFIC SETTINGS
# =============================================================================

# Use FHIR R4 format
exporter.fhir.use_us_core_ig = true
exporter.fhir.us_core_version = 4.0.0

# Include all FHIR resources
exporter.fhir.included_resources = Patient,Condition,AllergyIntolerance,MedicationRequest,Encounter,Immunization,Observation,Procedure,CarePlan,DiagnosticReport,DocumentReference

# =============================================================================
# CLINICAL NOTES SETTINGS
# =============================================================================

# Generate detailed clinical notes
exporter.clinical_note.mode = all

# Include notes for all encounter types
exporter.clinical_note.encounter_types = ambulatory,emergency,inpatient,wellness,urgentcare

# =============================================================================
# SEED FOR REPRODUCIBILITY (optional)
# =============================================================================
# generate.seed = 12345
